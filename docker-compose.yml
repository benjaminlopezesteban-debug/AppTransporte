x-servicio-comun: &servicio-comun
  restart: unless-stopped
  extra_hosts:
    - "host.docker.internal:host-gateway"
  environment: &servicio-entorno
    DB_URL: "jdbc:mysql://host.docker.internal:3307/appbelmonte?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC"
    DB_USERNAME: appbelmonte
    DB_PASSWORD: "Benja19924"
    EUREKA_URL: "http://eureka-server:8761/eureka/"

services:
  eureka-server:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: eureka-server
    image: appbelmonte/eureka-server:latest
    restart: unless-stopped
    ports:
      - "8761:8761"

  gateway:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: gateway
    image: appbelmonte/gateway:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      EUREKA_URL: "http://eureka-server:8761/eureka/"
    depends_on:
      - eureka-server

  rol-servicio:
    <<: *servicio-comun
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: rol-servicio
    image: appbelmonte/rol-servicio:latest
